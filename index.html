<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Jasmeen 💜</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --purple:#9b30ff; --purple-light:#c77dff; --purple-dark:#4b0082;
    --black:#07000f; --white:#ffffff;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overflow:hidden}
  body{
    font-family:'Poppins',sans-serif;color:var(--white);
    background:radial-gradient(ellipse at top,#2a0a4a 0%,#12001f 45%,var(--black) 100%);
    display:flex;align-items:center;justify-content:center;
  }
  #bg,#fw{position:fixed;inset:0;pointer-events:none}
  #bg{z-index:0}
  #fw{z-index:50}

  .screen{
    position:absolute;inset:0;display:none;flex-direction:column;align-items:center;
    justify-content:flex-start;text-align:center;padding:20px;z-index:2;overflow-y:auto;
    -webkit-overflow-scrolling:touch;
  }
  .screen::before,.screen::after{content:"";flex:1 0 0}
  .screen.active{display:flex;animation:pop .7s cubic-bezier(.2,1.4,.4,1)}
  @keyframes pop{from{opacity:0;transform:scale(.7) translateY(30px)}to{opacity:1;transform:none}}

  h1{
    font-family:'Pacifico',cursive;font-weight:400;
    font-size:clamp(1.8rem,7vw,3.6rem);line-height:1.25;
    background:linear-gradient(90deg,#fff,var(--purple-light),#fff,var(--purple-light));
    background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
    animation:shine 4s linear infinite;
    filter:drop-shadow(0 0 14px rgba(155,48,255,.8));
  }
  @keyframes shine{to{background-position:300% 0}}

  .title-big{
    font-family:'Poppins',sans-serif;font-weight:800;letter-spacing:2px;
    font-size:clamp(1.3rem,5.5vw,2.6rem);
    text-shadow:0 0 10px var(--purple),0 0 30px var(--purple),0 0 60px var(--purple-dark);
  }
  .title-big span{color:var(--purple-light)}

  .btns{display:flex;gap:22px;margin-top:34px;justify-content:center;flex-wrap:wrap}
  button{
    font-family:'Poppins',sans-serif;font-weight:800;font-size:1.25rem;letter-spacing:2px;
    padding:14px 44px;border-radius:50px;cursor:pointer;border:2px solid var(--purple-light);
    transition:transform .2s,box-shadow .2s;
  }
  .yes{
    background:linear-gradient(135deg,var(--purple),var(--purple-light));color:#fff;
    box-shadow:0 0 18px var(--purple),inset 0 0 10px rgba(255,255,255,.3);
  }
  .no{background:#fff;color:var(--black);box-shadow:0 0 14px rgba(255,255,255,.6)}
  button:hover{transform:scale(1.08)}
  button:active{transform:scale(.95)}

  /* puzzle: set the watch + enter the code */
  .hint{
    margin-top:18px;font-weight:600;color:var(--purple-light);
    text-shadow:0 0 10px var(--purple);font-size:clamp(.9rem,3.8vw,1.1rem);max-width:420px;
  }
  #puzzle{display:flex;flex-direction:column;align-items:center;transition:opacity .5s,filter .5s}
  #puzzle.locked{opacity:.3;filter:blur(2px);pointer-events:none}
  .code-label{margin-top:22px;font-size:.9rem;letter-spacing:4px;font-weight:600;color:var(--purple-light)}
  #codeIn{
    margin-top:8px;width:min(220px,70vw);text-align:center;font-family:'Poppins',sans-serif;
    font-size:clamp(2rem,10vw,3.4rem);font-weight:800;letter-spacing:10px;color:#fff;
    background:rgba(155,48,255,.15);border:3px solid var(--purple-light);border-radius:18px;
    padding:6px 0 6px 10px;outline:none;
    box-shadow:0 0 18px var(--purple),inset 0 0 14px rgba(155,48,255,.4);
    text-shadow:0 0 12px var(--purple-light);
  }
  #codeIn::placeholder{color:rgba(255,255,255,.3)}
  #codeIn.ok{border-color:#fff;box-shadow:0 0 30px var(--purple-light),inset 0 0 20px rgba(199,125,255,.6)}
  #codeIn.shake{animation:shake .4s}
  @keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
  .time-label.ok{color:#fff;text-shadow:0 0 14px #fff,0 0 30px var(--purple-light)}
  .clock-wrap{touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
  @media(max-width:480px){
    button{padding:12px 34px;font-size:1.1rem}
    .btns{gap:16px;margin-top:26px}
  }
  button{touch-action:manipulation}

  /* clock */
  .clock-wrap{margin-top:26px;position:relative;width:min(240px,60vw);height:min(240px,60vw)}
  .clock-wrap svg{width:100%;height:100%;overflow:visible}
  .rose{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    font-size:clamp(2rem,9vw,3.2rem);
    filter:drop-shadow(0 0 8px #ff4fa3) drop-shadow(0 0 20px #ff4fa3) drop-shadow(0 0 36px var(--purple));
    animation:glow 1.8s ease-in-out infinite alternate;
    pointer-events:none;
  }
  @keyframes glow{
    from{filter:drop-shadow(0 0 5px #ff4fa3) drop-shadow(0 0 12px var(--purple));transform:translate(-50%,-50%) scale(.95)}
    to{filter:drop-shadow(0 0 14px #ff4fa3) drop-shadow(0 0 40px #ff4fa3) drop-shadow(0 0 70px var(--purple-light));transform:translate(-50%,-50%) scale(1.12)}
  }
  .time-label{margin-top:10px;font-weight:600;letter-spacing:6px;color:var(--purple-light);text-shadow:0 0 10px var(--purple)}

  /* arrow + box */
  .arrow{
    font-size:3.4rem;margin:22px 0 8px;color:var(--purple-light);
    text-shadow:0 0 16px var(--purple);animation:bounce 1s infinite;
  }
  @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(16px)}}
  .tapbox{
    padding:22px 40px;border-radius:20px;cursor:pointer;
    font-weight:800;font-size:clamp(1.2rem,5vw,1.9rem);letter-spacing:3px;
    background:rgba(155,48,255,.15);border:3px dashed var(--purple-light);
    box-shadow:0 0 25px var(--purple),inset 0 0 25px rgba(155,48,255,.4);
    animation:pulse 1.6s infinite;
  }
  @keyframes pulse{0%,100%{box-shadow:0 0 20px var(--purple),inset 0 0 20px rgba(155,48,255,.4)}50%{box-shadow:0 0 50px var(--purple-light),inset 0 0 35px rgba(199,125,255,.6)}}

  .thanks{
    font-family:'Pacifico',cursive;font-size:clamp(2rem,8vw,4.2rem);line-height:1.3;
    color:#fff;text-shadow:0 0 15px var(--purple),0 0 40px var(--purple-light),0 0 70px #ff4fa3;
    animation:pop .8s both,float 3s ease-in-out infinite .8s;
  }
  @keyframes float{50%{transform:translateY(-14px)}}
  .ring-big{font-size:4.5rem;margin-top:14px;animation:float 2.2s ease-in-out infinite;filter:drop-shadow(0 0 18px var(--purple-light))}

  .corner{position:fixed;font-size:1.6rem;opacity:.7;z-index:1;animation:float 4s ease-in-out infinite;filter:drop-shadow(0 0 8px var(--purple))}
</style>
</head>
<body>

<canvas id="bg"></canvas>
<canvas id="fw"></canvas>
<div class="corner" style="top:14px;left:16px">🌹</div>
<div class="corner" style="top:14px;right:16px;animation-delay:1s">💜</div>
<div class="corner" style="bottom:14px;left:16px;animation-delay:2s">💜</div>
<div class="corner" style="bottom:14px;right:16px;animation-delay:.5s">🌹</div>

<!-- SCREEN 1 -->
<div class="screen active" id="s1">
  <h1>Are you angry with me? 🥺</h1>
  <div class="btns">
    <button class="yes" onclick="go('s2')">YES</button>
    <button class="no" onclick="go('s2')">NO</button>
  </div>
</div>

<!-- SCREEN 2 -->
<div class="screen" id="s2">
  <h1>ARE YOU STILL ANGRY WITH ME??? 😢</h1>
  <div class="btns" style="margin-top:22px">
    <button class="yes" onclick="answered()">YES</button>
    <button class="no" onclick="answered()">NO</button>
  </div>
  <div class="hint" id="hint">Pehle YES ya NO dabao 💜</div>

  <div id="puzzle" class="locked">
  <div class="code-label">ENTER THE CODE</div>
  <input id="codeIn" type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="3" placeholder="___" autocomplete="off" disabled>

  <div class="clock-wrap" id="clockWrap">
    <svg viewBox="0 0 200 200">
      <defs>
        <radialGradient id="face" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#1a0030"/><stop offset="100%" stop-color="#07000f"/>
        </radialGradient>
        <filter id="g"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      </defs>
      <circle cx="100" cy="100" r="96" fill="url(#face)" stroke="#c77dff" stroke-width="4" filter="url(#g)"/>
      <circle cx="100" cy="100" r="88" fill="none" stroke="#fff" stroke-width="1" opacity=".5"/>
      <g id="ticks"></g>
      <line id="hHand" x1="100" y1="100" x2="100" y2="52" stroke="#fff" stroke-width="6" stroke-linecap="round" transform="rotate(0 100 100)" filter="url(#g)"/>
      <line id="mHand" x1="100" y1="100" x2="100" y2="30" stroke="#c77dff" stroke-width="4" stroke-linecap="round" transform="rotate(0 100 100)" filter="url(#g)"/>
      <circle cx="100" cy="100" r="9" fill="#9b30ff"/>
    </svg>
    <div class="rose">🌹</div>
  </div>
  <div class="time-label" id="timeLabel">12 : 00</div>
  </div>
</div>

<!-- SCREEN 3 -->
<div class="screen" id="s3">
  <div class="title-big">MY LOVE <span>JASMEEN</span><br>ITS FOR YOU 💜</div>
  <div class="arrow">⬇</div>
  <div class="tapbox" onclick="go('s4')">TAB HERE WIFEY 💜</div>
</div>

<!-- SCREEN 4 -->
<div class="screen" id="s4">
  <h1 style="font-size:clamp(2.2rem,9vw,4.4rem)">WILL YOU MARRY ME 💍</h1>
  <div class="btns">
    <button class="yes" id="yesBtn">YES</button>
    <button class="no" id="noBtn">NO</button>
  </div>
</div>

<!-- SCREEN 5 -->
<div class="screen" id="s5">
  <div class="thanks">AWWW MY LOVE<br>THANK YOUUUU💍</div>
  <div class="ring-big">💍🌹💜</div>
</div>

<script>
/* ---------- screen switching ---------- */
function go(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

/* ---------- puzzle: answer -> set watch to 1:40 -> enter code 143 ---------- */
let answeredFlag=false,done=false,hr=12,mn=0,clockOk=false,codeOk=false,dragging=false;
const hHand=document.getElementById('hHand'),mHand=document.getElementById('mHand');
const timeLabel=document.getElementById('timeLabel'),codeIn=document.getElementById('codeIn');
const hint=document.getElementById('hint'),cw=document.getElementById('clockWrap');

function answered(){
  if(answeredFlag)return;
  answeredFlag=true;
  document.getElementById('puzzle').classList.remove('locked');
  codeIn.disabled=false;
  hint.textContent='Ab watch mein time 1:40 set karo (ungli se ghumao) aur code 143 daalo 💜';
  setTimeout(()=>document.getElementById('puzzle').scrollIntoView({behavior:'smooth',block:'center'}),200);
}
function check(){
  if(!answeredFlag||done)return;
  if(clockOk&&codeOk){
    done=true;
    hint.textContent='Perfect my love 💜✨';
    setTimeout(()=>go('s3'),1100);
  }
}
function drawClock(){
  hHand.setAttribute('transform',`rotate(${(hr%12)*30+mn*.5} 100 100)`);
  mHand.setAttribute('transform',`rotate(${mn*6} 100 100)`);
  timeLabel.textContent=`${hr} : ${String(mn).padStart(2,'0')}`;
  clockOk=(hr===1&&mn===40);
  timeLabel.classList.toggle('ok',clockOk);
  check();
}
function setFromPointer(e){
  const r=cw.getBoundingClientRect();
  const a=Math.atan2(e.clientY-(r.top+r.height/2),e.clientX-(r.left+r.width/2))*180/Math.PI+90;
  let m=Math.round(((a+360)%360)/6)%60;
  if(Math.abs(m-40)<=1)m=40;
  if(mn>=45&&m<=15)hr=hr%12+1;
  else if(mn<=15&&m>=45)hr=(hr+10)%12+1;
  mn=m;drawClock();
}
cw.addEventListener('pointerdown',e=>{
  if(!answeredFlag||done)return;
  dragging=true;cw.setPointerCapture(e.pointerId);setFromPointer(e);e.preventDefault();
});
cw.addEventListener('pointermove',e=>{if(dragging)setFromPointer(e)});
['pointerup','pointercancel'].forEach(ev=>cw.addEventListener(ev,()=>dragging=false));
drawClock();

codeIn.addEventListener('input',()=>{
  codeIn.value=codeIn.value.replace(/\D/g,'').slice(0,3);
  codeOk=(codeIn.value==='143');
  codeIn.classList.toggle('ok',codeOk);
  if(codeIn.value.length===3&&!codeOk){
    codeIn.classList.remove('shake');void codeIn.offsetWidth;codeIn.classList.add('shake');
  }
  check();
});

/* clock ticks */
(function(){
  const g=document.getElementById('ticks');let h='';
  for(let i=0;i<12;i++){
    const big=i%3===0;
    h+=`<line x1="100" y1="${big?10:14}" x2="100" y2="${big?24:20}" stroke="${big?'#fff':'#c77dff'}" stroke-width="${big?4:2}" transform="rotate(${i*30} 100 100)"/>`;
  }
  g.innerHTML=h;
})();

/* ---------- background floating hearts & stars ---------- */
const bg=document.getElementById('bg'),bx=bg.getContext('2d');
let W,H,floaters=[];
function resize(){
  W=bg.width=fw.width=innerWidth;H=bg.height=fw.height=innerHeight;
}
const fw=document.getElementById('fw'),fx=fw.getContext('2d');
addEventListener('resize',resize);resize();
const syms=['💜','✨','🌹','⭐','🤍','💫'];
for(let i=0;i<32;i++){
  floaters.push({x:Math.random()*innerWidth,y:Math.random()*innerHeight,
    s:10+Math.random()*20,v:.3+Math.random()*.9,sym:syms[i%syms.length],o:.15+Math.random()*.35,d:Math.random()*6});
}
function drawBg(t){
  bx.clearRect(0,0,W,H);
  floaters.forEach(f=>{
    f.y-=f.v;if(f.y<-30){f.y=H+30;f.x=Math.random()*W}
    bx.globalAlpha=f.o;bx.font=f.s+'px serif';
    bx.fillText(f.sym,f.x+Math.sin(t/900+f.d)*18,f.y);
  });
  bx.globalAlpha=1;
}

/* ---------- running NO button ---------- */
const noBtn=document.getElementById('noBtn');
function runAway(e){
  if(e){e.preventDefault();e.stopPropagation();}
  if(!noBtn.dataset.moved){
    // keep an empty spot next to YES so the layout doesn't jump
    const ph=document.createElement('span');
    ph.style.cssText=`display:inline-block;width:${noBtn.offsetWidth}px;height:${noBtn.offsetHeight}px`;
    noBtn.parentNode.insertBefore(ph,noBtn);
    noBtn.dataset.moved='1';
  }
  noBtn.style.position='fixed';
  const bw=noBtn.offsetWidth,bh=noBtn.offsetHeight;
  const x=Math.random()*(innerWidth-bw-20)+10;
  const y=Math.random()*(innerHeight-bh-20)+10;
  noBtn.style.left=x+'px';noBtn.style.top=y+'px';noBtn.style.zIndex=20;
  noBtn.style.transition='left .25s, top .25s, transform .2s';
}
['pointerdown','touchstart','click'].forEach(ev=>
  noBtn.addEventListener(ev,runAway,{passive:false}));

/* ---------- fireworks ---------- */
let particles=[],rockets=[],fireworksOn=false;
const colors=['#c77dff','#9b30ff','#ffffff','#ff4fa3','#e0aaff','#7b2ff7'];
function burst(x,y){
  const c=colors[Math.floor(Math.random()*colors.length)];
  const n=70+Math.floor(Math.random()*40);
  for(let i=0;i<n;i++){
    const a=Math.PI*2*i/n,sp=1+Math.random()*5;
    particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,
      c:Math.random()<.3?'#fff':c,r:1.5+Math.random()*2});
  }
}
function launch(){
  rockets.push({x:Math.random()*W,y:H,vy:-(8+Math.random()*5),ty:H*(.15+Math.random()*.4)});
}
function drawFw(){
  fx.globalCompositeOperation='destination-out';
  fx.fillStyle='rgba(0,0,0,.22)';fx.fillRect(0,0,W,H);
  fx.globalCompositeOperation='lighter';
  rockets=rockets.filter(r=>{
    r.y+=r.vy;r.vy*=.985;
    fx.fillStyle='#fff';fx.beginPath();fx.arc(r.x,r.y,2.5,0,7);fx.fill();
    if(r.y<=r.ty||r.vy>-1.5){burst(r.x,r.y);return false}
    return true;
  });
  particles=particles.filter(p=>{
    p.x+=p.vx;p.y+=p.vy;p.vy+=.06;p.vx*=.985;p.life-=.012;
    if(p.life<=0)return false;
    fx.globalAlpha=p.life;fx.fillStyle=p.c;fx.beginPath();fx.arc(p.x,p.y,p.r,0,7);fx.fill();
    return true;
  });
  fx.globalAlpha=1;
}
function startFireworks(){
  if(fireworksOn)return;fireworksOn=true;
  for(let i=0;i<6;i++)setTimeout(launch,i*180);
  setInterval(()=>{for(let i=0;i<2;i++)setTimeout(launch,i*150)},700);
  // confetti of hearts/roses raining
  setInterval(()=>{
    const e=document.createElement('div');
    e.textContent=['💜','🌹','💍','✨'][Math.floor(Math.random()*4)];
    e.style.cssText=`position:fixed;top:-40px;left:${Math.random()*100}vw;font-size:${18+Math.random()*26}px;z-index:40;pointer-events:none;transition:transform ${4+Math.random()*3}s linear,opacity 5s;`;
    document.body.appendChild(e);
    requestAnimationFrame(()=>{e.style.transform=`translateY(${innerHeight+80}px) rotate(${Math.random()*540}deg)`;e.style.opacity=.2});
    setTimeout(()=>e.remove(),7500);
  },180);
}
document.getElementById('yesBtn').addEventListener('click',()=>{
  go('s5');startFireworks();
});

function loop(t){drawBg(t);drawFw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script>
</body>
</html>
